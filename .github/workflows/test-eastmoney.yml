name: 测试东财概念板块接口

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 AKShare
        run: pip install akshare

      - name: 测试东财概念板块接口
        run: |
          python3 -c "
          import akshare as ak
          import json

          # 1. 概念板块列表
          print('=== 东财概念板块列表 ===')
          try:
              df = ak.stock_board_concept_name_em()
              print(f'总数: {len(df)}')
              print(f'列名: {list(df.columns)}')
              print(df.head(10).to_string())
          except Exception as e:
              print(f'错误: {e}')

          print()

          # 2. 概念板块K线
          print('=== 机器人概念 K线 ===')
          try:
              df2 = ak.stock_board_concept_hist_em(symbol='机器人概念', period='日k', start_date='20260414', end_date='20260418', adjust='')
              print(f'列名: {list(df2.columns)}')
              print(df2.to_string())
          except Exception as e:
              print(f'错误: {e}')

          print()

          # 3. 概念板块成分股
          print('=== 机器人概念 成分股 ===')
          try:
              df3 = ak.stock_board_concept_cons_em(symbol='机器人概念')
              print(f'总数: {len(df3)}')
              print(f'列名: {list(df3.columns)}')
              print(df3.head(10).to_string())
          except Exception as e:
              print(f'错误: {e}')

          print()

          # 4. 概念板块资金流（同花顺）
          print('=== 概念板块资金流（同花顺）===')
          try:
              df4 = ak.stock_fund_flow_concept(symbol='即时')
              print(f'总数: {len(df4)}')
              print(f'列名: {list(df4.columns)}')
              print(df4.head(5).to_string())
          except Exception as e:
              print(f'错误: {e}')
          "
