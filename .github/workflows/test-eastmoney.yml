name: 测试东财连通性

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: curl 和 Python 测试东财 K 线 API
        run: |
          echo "=== curl push2his（无前缀）==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            "https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=90.BK0927&fields1=f1&fields2=f51&klt=101&fqt=0&lmt=1&end=20500101&ut=fa5fd1943c7b386f172d6893dbfba10b" \
            -H "User-Agent: Mozilla/5.0" --connect-timeout 5 || echo "FAILED"

          echo "=== curl 33.push2his ==="
          curl -s -w "\nHTTP %{http_code}\n" \
            "https://33.push2his.eastmoney.com/api/qt/stock/kline/get?secid=90.BK0927&fields1=f1,f2,f3&fields2=f51,f52,f53,f54,f55&klt=101&fqt=0&lmt=1&end=20500101&ut=fa5fd1943c7b386f172d6893dbfba10b" \
            -H "User-Agent: Mozilla/5.0" --connect-timeout 5 || echo "FAILED"

          echo "=== Python requests ==="
          python3 -c "
          import requests
          for node in ['', '33', '67']:
              prefix = f'{node}.' if node else ''
              url = f'https://{prefix}push2his.eastmoney.com/api/qt/stock/kline/get'
              params = {'secid':'90.BK0927','fields1':'f1','fields2':'f51','klt':'101','fqt':'0','lmt':'1','end':'20500101','ut':'fa5fd1943c7b386f172d6893dbfba10b'}
              headers = {'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}
              try:
                  r = requests.get(url, params=params, headers=headers, timeout=10)
                  print(f'{prefix}push2his: OK {r.status_code} {r.text[:100]}')
              except Exception as e:
                  print(f'{prefix}push2his: FAIL {e}')
          "
