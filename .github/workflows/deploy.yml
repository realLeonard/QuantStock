name: 部署到阿里云

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 判断变更范围
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # 一次推送可能含多个 commit，必须 diff 整个推送区间；
          # 之前用 HEAD~1 只看最后一个 commit，多 commit 推送会漏检导致服务不重启
          if [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE_SHA" HEAD)
          else
            CHANGED="all"
          fi
          echo "changed=$CHANGED"

          if [ "$CHANGED" = "all" ] || echo "$CHANGED" | grep -q "^backend/api/"; then
            echo "api_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "api_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$CHANGED" = "all" ] || echo "$CHANGED" | grep -qE "^apps/web/|^packages/"; then
            echo "web_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "web_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 部署到服务器
        run: |
          API_CHANGED="${{ steps.changes.outputs.api_changed }}"
          WEB_CHANGED="${{ steps.changes.outputs.web_changed }}"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
          set -e
          cd /www/wwwroot/quantstock

          echo ">>> 拉取最新代码"
          git checkout -- package-lock.json 2>/dev/null || true
          git pull origin main

          echo ">>> 安装依赖"
          npm install
          ENDSSH

          if [ "$API_CHANGED" = "true" ]; then
            echo ">>> 构建并重启 API"
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "cd /www/wwwroot/quantstock/backend/api && npm run build && pm2 restart quantstock-api"
          fi

          if [ "$WEB_CHANGED" = "true" ]; then
            echo ">>> 构建并重启 Web"
            # 服务器仅 2G 内存，限制 Node 堆大小避免 next build 被 OOM killer SIGKILL
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "cd /www/wwwroot/quantstock/apps/web && NODE_OPTIONS='--max-old-space-size=1024' npm run build && pm2 restart quantstock-web"
          fi

          echo ">>> 部署完成"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "pm2 list"
