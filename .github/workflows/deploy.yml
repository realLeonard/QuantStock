name: 部署到阿里云

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 判断变更范围
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "all")
          echo "changed=$CHANGED"

          if echo "$CHANGED" | grep -q "^backend/api/"; then
            echo "api_changed=true" >> $GITHUB_OUTPUT
          else
            echo "api_changed=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -qE "^apps/web/|^packages/"; then
            echo "web_changed=true" >> $GITHUB_OUTPUT
          else
            echo "web_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          printf '%b' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 部署到服务器
        run: |
          API_CHANGED="${{ steps.changes.outputs.api_changed }}"
          WEB_CHANGED="${{ steps.changes.outputs.web_changed }}"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
          set -e
          cd ~/quantstock

          echo ">>> 拉取最新代码"
          git pull origin main

          echo ">>> 安装依赖"
          npm install
          ENDSSH

          if [ "$API_CHANGED" = "true" ]; then
            echo ">>> 构建并重启 API"
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "cd ~/quantstock/backend/api && npm run build && pm2 restart quantstock-api"
          fi

          if [ "$WEB_CHANGED" = "true" ]; then
            echo ">>> 构建并重启 Web"
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
              "cd ~/quantstock/apps/web && npm run build && pm2 restart quantstock-web"
          fi

          echo ">>> 部署完成"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "pm2 list"
