name: 手动测试（韭研Vision / 每日复盘）

on:
  workflow_dispatch:
    inputs:
      task:
        description: '任务类型'
        required: true
        type: choice
        options:
          - jiuyan-vision
          - daily-review
      date:
        description: '日期（YYYY-MM-DD），留空=今天'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装 Node 依赖
        run: npm ci

      # ====== 韭研 Vision ======

      - name: 安装 Claude Code CLI
        if: inputs.task == 'jiuyan-vision'
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: 配置 Claude Code CLI
        if: inputs.task == 'jiuyan-vision'
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        shell: bash
        run: |
          mkdir -p ~/.claude
          cat > ~/.claude/settings.json << EOF
          {
            "env": {
              "ANTHROPIC_API_KEY": "$ANTHROPIC_AUTH_TOKEN",
              "ANTHROPIC_AUTH_TOKEN": "$ANTHROPIC_AUTH_TOKEN",
              "ANTHROPIC_BASE_URL": "$ANTHROPIC_BASE_URL",
              "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1"
            }
          }
          EOF
          echo "=== CLI 版本 ==="
          claude --version || true
          echo "=== 管道测试（--bare）==="
          echo "回复OK" | timeout 60 claude -p --bare --no-session-persistence 2>&1 || echo "退出码: $?"

      - name: 运行韭研 Vision 解析
        if: inputs.task == 'jiuyan-vision'
        env:
          JIUYAN_SESSION: ${{ secrets.JIUYAN_SESSION }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          CLAUDE_DEBUG_DIR: ${{ runner.temp }}/claude-debug
        shell: bash
        run: |
          mkdir -p "$CLAUDE_DEBUG_DIR"
          DATE_ARG="${{ github.event.inputs.date }}"
          if [ -z "$DATE_ARG" ]; then
            DATE_ARG=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          fi
          echo "=== 测试日期: $DATE_ARG ==="
          npx tsx scripts/daily-review/jiuyan-image-fetch.ts "$DATE_ARG" 2>&1

      - name: 上传 Claude CLI debug 日志
        if: inputs.task == 'jiuyan-vision' && always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-debug-logs
          path: ${{ runner.temp }}/claude-debug/*.log
          retention-days: 7
          if-no-files-found: ignore

      # ====== 每日复盘 AI 总结 ======

      - name: Setup Python
        if: inputs.task == 'daily-review'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/daily-review/python/requirements.txt

      - name: 安装 Python 依赖
        if: inputs.task == 'daily-review'
        run: pip install -r scripts/daily-review/python/requirements.txt

      - name: 安装 Claude Code CLI（AI 总结）
        if: inputs.task == 'daily-review'
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: 配置 Claude Code CLI（AI 总结）
        if: inputs.task == 'daily-review'
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        shell: bash
        run: |
          mkdir -p ~/.claude
          cat > ~/.claude/settings.json << EOF
          {
            "env": {
              "ANTHROPIC_API_KEY": "$ANTHROPIC_AUTH_TOKEN",
              "ANTHROPIC_AUTH_TOKEN": "$ANTHROPIC_AUTH_TOKEN",
              "ANTHROPIC_BASE_URL": "$ANTHROPIC_BASE_URL",
              "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1"
            }
          }
          EOF

      - name: Python 数据采集
        if: inputs.task == 'daily-review'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          DATE_ARG="${{ github.event.inputs.date }}"
          if [ -z "$DATE_ARG" ]; then
            DATE_ARG=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          fi
          echo "=== 采集日期: $DATE_ARG ==="
          cd scripts/daily-review/python
          python main.py --date "$DATE_ARG"

      - name: AI 总结（不推送）
        if: inputs.task == 'daily-review'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        shell: bash
        run: |
          DATE_ARG="${{ github.event.inputs.date }}"
          if [ -z "$DATE_ARG" ]; then
            DATE_ARG=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          fi
          echo "=== 总结日期: $DATE_ARG ==="
          npx tsx scripts/daily-review/index.ts --date "$DATE_ARG"
