name: 测试韭研 Vision 解析

on:
  workflow_dispatch:
    inputs:
      date:
        description: '日期（YYYY-MM-DD），留空=今天'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-vision:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装 Node 依赖
        run: npm ci

      - name: 安装 Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: 配置 Claude Code CLI
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        shell: bash
        run: |
          mkdir -p ~/.claude
          cat > ~/.claude/settings.json << EOF
          {
            "env": {
              "ANTHROPIC_AUTH_TOKEN": "$ANTHROPIC_AUTH_TOKEN",
              "ANTHROPIC_BASE_URL": "$ANTHROPIC_BASE_URL",
              "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1"
            }
          }
          EOF
          echo "=== CLI 版本 ==="
          claude --version || true
          echo "=== 管道测试 ==="
          echo "回复OK" | timeout 60 claude -p --no-session-persistence 2>&1 || echo "退出码: $?"

      - name: 运行韭研 Vision 解析
        env:
          JIUYAN_SESSION: ${{ secrets.JIUYAN_SESSION }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          CLAUDE_DEBUG_DIR: ${{ runner.temp }}/claude-debug
        shell: bash
        run: |
          mkdir -p "$CLAUDE_DEBUG_DIR"
          DATE_ARG="${{ github.event.inputs.date }}"
          if [ -z "$DATE_ARG" ]; then
            DATE_ARG=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          fi
          echo "=== 测试日期: $DATE_ARG ==="
          npx tsx scripts/daily-review/jiuyan-image-fetch.ts "$DATE_ARG" 2>&1

      # 无论上一步是否失败，都把 CLI 的 --debug-file 日志上传成 artifact，
      # 便于事后定位 hang / 退出码异常 / 模型输出非预期等任意问题。
      - name: 上传 Claude CLI debug 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-debug-logs
          path: ${{ runner.temp }}/claude-debug/*.log
          retention-days: 7
          if-no-files-found: ignore
