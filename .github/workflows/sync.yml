name: 概念主题每日同步

on:
  workflow_dispatch:  # 由 cron-job.org 外部触发（每天 09:15 / 11:15 / 13:15 / 17:15 / 23:15 BJ）

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # cron-job.org 每天触发 5 次；工作日全部放行，周末只放行 09:XX 和 17:XX
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        run: |
          echo "run=1" >> "$GITHUB_OUTPUT"

  sync:
    needs: gate
    if: needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install
        working-directory: scripts/scraper

      - name: 执行同步
        id: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          JY_TOKEN: ${{ secrets.JY_TOKEN }}
        run: |
          set +e
          npx tsx index.ts 2>&1 | tee /tmp/sync-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          OUTPUT=$(cat /tmp/sync-output.txt)

          echo "## 同步结果" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$OUTPUT" | tail -30 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          NEW_COUNT=$(echo "$OUTPUT" | grep -oE "新增 [0-9]+ 个" | grep -oE "[0-9]+" | tail -1)
          UPDATE_COUNT=$(echo "$OUTPUT" | grep -oE "前15更新 [0-9]+ 个" | grep -oE "[0-9]+" | tail -1)
          META_COUNT=$(echo "$OUTPUT" | grep -oE "前15排序变化 [0-9]+ 个" | grep -oE "[0-9]+" | tail -1)
          FAIL_COUNT=$(echo "$OUTPUT" | grep -oE "最终失败 [0-9]+" | grep -oE "[0-9]+" | tail -1)

          echo "new_count=${NEW_COUNT:-0}" >> $GITHUB_OUTPUT
          echo "update_count=${UPDATE_COUNT:-0}" >> $GITHUB_OUTPUT
          echo "meta_count=${META_COUNT:-0}" >> $GITHUB_OUTPUT
          echo "fail_count=${FAIL_COUNT:-0}" >> $GITHUB_OUTPUT
          echo "exit_code=${EXIT_CODE}" >> $GITHUB_OUTPUT
        working-directory: scripts/scraper

      - name: Bark 推送通知
        if: always()
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          NEW_COUNT="${{ steps.sync.outputs.new_count }}"
          UPDATE_COUNT="${{ steps.sync.outputs.update_count }}"
          META_COUNT="${{ steps.sync.outputs.meta_count }}"
          FAIL_COUNT="${{ steps.sync.outputs.fail_count }}"
          EXIT_CODE="${{ steps.sync.outputs.exit_code }}"

          if [ "$EXIT_CODE" != "0" ]; then
            TITLE="❌ 概念主题同步异常"
            BODY="脚本运行出错，请检查 Actions 日志"
          elif [ "$NEW_COUNT" = "0" ] && [ "$UPDATE_COUNT" = "0" ] && [ "$META_COUNT" = "0" ]; then
            TITLE="✅ 概念主题同步无变化"
            BODY="主题数据源暂无新增或更新的主题"
          elif [ "$FAIL_COUNT" = "0" ]; then
            TITLE="✅ 概念主题同步完成"
            BODY="新增 ${NEW_COUNT} 个，更新 ${UPDATE_COUNT} 个，排序变化 ${META_COUNT} 个，全部成功"
          else
            TITLE="⚠️ 概念主题同步完成"
            BODY="新增 ${NEW_COUNT} 个，更新 ${UPDATE_COUNT} 个，排序变化 ${META_COUNT} 个，${FAIL_COUNT} 个失败"
          fi

          TITLE_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TITLE")
          BODY_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$BODY")
          curl -s "https://api.day.app/${BARK_KEY}/${TITLE_ENC}/${BODY_ENC}?group=QuantStock" || true
