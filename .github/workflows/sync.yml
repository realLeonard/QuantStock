name: 概念主题每日同步

on:
  workflow_dispatch:  # 由 cron-job.org 外部触发（北京时间 09:00 / 12:00 / 21:00）

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm install
        working-directory: scripts/scraper

      - name: 执行同步
        id: sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          JY_TOKEN: ${{ secrets.JY_TOKEN }}
        run: |
          set +e
          npx tsx index.ts 2>&1 | tee /tmp/sync-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          OUTPUT=$(cat /tmp/sync-output.txt)

          echo "## 同步结果" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$OUTPUT" | tail -30 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          NEW_COUNT=$(echo "$OUTPUT" | grep -oE "新增 [0-9]+ 个" | grep -oE "[0-9]+" | tail -1)
          UPDATE_COUNT=$(echo "$OUTPUT" | grep -oE "前15更新\(重抓\) [0-9]+ 个" | grep -oE "[0-9]+" | tail -1)
          META_COUNT=$(echo "$OUTPUT" | grep -oE "前15元数据变更 [0-9]+ 个" | grep -oE "[0-9]+" | tail -1)
          FAIL_COUNT=$(echo "$OUTPUT" | grep -oE "最终失败 [0-9]+" | grep -oE "[0-9]+" | tail -1)

          echo "new_count=${NEW_COUNT:-0}" >> $GITHUB_OUTPUT
          echo "update_count=${UPDATE_COUNT:-0}" >> $GITHUB_OUTPUT
          echo "meta_count=${META_COUNT:-0}" >> $GITHUB_OUTPUT
          echo "fail_count=${FAIL_COUNT:-0}" >> $GITHUB_OUTPUT
          echo "exit_code=${EXIT_CODE}" >> $GITHUB_OUTPUT
        working-directory: scripts/scraper

      - name: Bark 推送通知
        if: always()
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          NEW_COUNT="${{ steps.sync.outputs.new_count }}"
          UPDATE_COUNT="${{ steps.sync.outputs.update_count }}"
          META_COUNT="${{ steps.sync.outputs.meta_count }}"
          FAIL_COUNT="${{ steps.sync.outputs.fail_count }}"
          EXIT_CODE="${{ steps.sync.outputs.exit_code }}"

          if [ "$EXIT_CODE" != "0" ]; then
            TITLE="❌ 概念主题同步异常"
            BODY="脚本运行出错，请检查 Actions 日志"
          elif [ "$NEW_COUNT" = "0" ] && [ "$UPDATE_COUNT" = "0" ] && [ "$META_COUNT" = "0" ]; then
            TITLE="✅ 概念主题同步无变化"
            BODY="主题数据源暂无新增或更新的主题"
          elif [ "$FAIL_COUNT" = "0" ]; then
            TITLE="✅ 概念主题同步完成"
            BODY="新增 ${NEW_COUNT} 个，重抓 ${UPDATE_COUNT} 个，元数据 ${META_COUNT} 个，全部成功"
          else
            TITLE="⚠️ 概念主题同步完成"
            BODY="新增 ${NEW_COUNT} 个，重抓 ${UPDATE_COUNT} 个，元数据 ${META_COUNT} 个，${FAIL_COUNT} 个失败"
          fi

          TITLE_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TITLE")
          BODY_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$BODY")
          curl -s "https://api.day.app/${BARK_KEY}/${TITLE_ENC}/${BODY_ENC}?group=QuantStock" || true
