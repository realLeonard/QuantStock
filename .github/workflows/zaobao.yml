name: 每日早报生成

on:
  workflow_dispatch:  # 由 cron-job.org 外部触发

jobs:
  collect-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/zaobao/python/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt
        working-directory: scripts/zaobao/python

      - name: 安装 Node 依赖
        run: npm install
        working-directory: scripts/zaobao

      - name: 采集市场行情数据
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python main.py
        working-directory: scripts/zaobao/python

      - name: 采集财联社热门+A股（确保新闻数据最新）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python cls_news_collector.py --mode depth
        working-directory: scripts/zaobao/python

      - name: 生成早报
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: npx tsx index.ts
        working-directory: scripts/zaobao
