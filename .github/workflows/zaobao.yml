name: 每日早报生成

on:
  workflow_dispatch:  # 由 cron-job.org 外部触发

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/shared
      - id: check
        run: |
          RESULT=$(python3 -c "
          import sys; sys.path.insert(0, 'scripts/shared')
          from trading_calendar import is_trading_day_today
          print('1' if is_trading_day_today() else '0')
          ")
          echo "run=$RESULT" >> "$GITHUB_OUTPUT"
          if [ "$RESULT" = "0" ]; then
            echo '非交易日，跳过早报'
          else
            echo '交易日，执行早报'
          fi

  collect-and-generate:
    needs: gate
    if: needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/zaobao/python/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt
        working-directory: scripts/zaobao/python

      - name: 安装 Node 依赖
        run: npm install
        working-directory: scripts/zaobao

      - name: 安装 Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: 采集市场行情数据
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python main.py
        working-directory: scripts/zaobao/python

      - name: 采集财联社热门+A股（确保新闻数据最新）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python cls_news_collector.py --mode depth
        working-directory: scripts/zaobao/python

      - name: 生成早报
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          CLAUDE_CODE_ATTRIBUTION_HEADER: '0'
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: npx tsx index.ts
        working-directory: scripts/zaobao
