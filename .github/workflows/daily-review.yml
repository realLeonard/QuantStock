name: 每日复盘

on:
  workflow_dispatch:  # 由 cron-job.org 外部触发

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/shared
      - id: check
        run: |
          RESULT=$(python3 -c "
          import sys; sys.path.insert(0, 'scripts/shared')
          from trading_calendar import is_trading_day_today
          print('1' if is_trading_day_today() else '0')
          ")
          echo "run=$RESULT" >> "$GITHUB_OUTPUT"
          if [ "$RESULT" = "0" ]; then
            echo '非交易日，跳过复盘'
          else
            echo '交易日，执行复盘'
          fi

  collect-and-review:
    needs: gate
    if: needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 执行每日复盘（阿里云）
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << ENDSSH
          set -e
          cd /www/wwwroot/quantstock

          # 加载环境变量
          set -a && source .env.server && set +a
          export ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
          export ANTHROPIC_AUTH_TOKEN="${{ secrets.ANTHROPIC_AUTH_TOKEN }}"
          export ANTHROPIC_BASE_URL="${{ secrets.ANTHROPIC_BASE_URL }}"
          export TUSHARE_TOKEN="${{ secrets.TUSHARE_TOKEN }}"
          export CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1
          export CLAUDE_CODE_ATTRIBUTION_HEADER=0

          echo "====== [1/3] 拉取最新代码 ======"
          git checkout -- package-lock.json 2>/dev/null || true
          git pull origin main

          echo "====== [2/3] Python 数据采集 ======"
          cd scripts/daily-review/python
          python3.11 main.py

          echo "====== [3/3] AI 总结 + 推送 ======"
          cd /www/wwwroot/quantstock/scripts/daily-review
          npx tsx index.ts

          echo "====== 完成 ======"
          ENDSSH
