name: 每日复盘

on:
  workflow_dispatch:  # 由 cron-job.org 外部触发

jobs:
  collect-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 执行每日复盘（阿里云）
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
          set -e
          cd /www/wwwroot/quantstock

          # 加载环境变量
          set -a && source .env.server && set +a

          echo "====== [1/3] 拉取最新代码 ======"
          git checkout -- package-lock.json 2>/dev/null || true
          git pull origin main

          echo "====== [2/3] Python 数据采集 ======"
          cd scripts/daily-review/python
          python3.11 main.py

          echo "====== [3/3] AI 总结 + 推送 ======"
          cd /www/wwwroot/quantstock/scripts/daily-review
          npx tsx index.ts

          echo "====== 完成 ======"
          ENDSSH
