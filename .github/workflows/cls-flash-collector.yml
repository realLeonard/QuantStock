name: 财联社快讯采集

on:
  schedule:
    - cron: '37 * * * *'  # 每小时第37分钟触发（北京时间）
  workflow_dispatch:        # 支持手动触发调试

concurrency:
  group: cls-flash-collector
  cancel-in-progress: false  # 不取消进行中的任务，等待上次完成

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/zaobao/python/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt
        working-directory: scripts/zaobao/python

      - name: 执行快讯采集
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python cls_news_collector.py --mode flash
        working-directory: scripts/zaobao/python
