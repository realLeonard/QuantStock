name: 财联社快讯采集

on:
  workflow_dispatch:  # 由 cron-job.org 外部触发

concurrency:
  group: cls-flash-collector
  cancel-in-progress: false  # 不取消进行中的任务，等待上次完成

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/zaobao/python/requirements.txt

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt
        working-directory: scripts/zaobao/python

      # 第 7 步「采集韭研涨停原因」通过 npx tsx 调用 jiuyan-image-fetch.ts（千问 Vision 解析）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 执行快讯采集
        id: collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          JIUYAN_SESSION: ${{ secrets.JIUYAN_SESSION }}
          JIUYAN_SIGN_SECRET: ${{ secrets.JIUYAN_SIGN_SECRET }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          python cls_news_collector.py --mode flash 2>&1 | tee /tmp/cls-log.txt
          # 只检测第 7 步（韭研涨停原因）失败 —— Python try/except 吞掉异常，这里扫日志兜底
          if grep -qE "\[limitUpReasons\].*(失败|超时)" /tmp/cls-log.txt; then
            FAIL_LINE=$(grep -m1 -E "\[limitUpReasons\].*(失败|超时)" /tmp/cls-log.txt | head -c 200)
            echo "step7_fail=1" >> "$GITHUB_OUTPUT"
            echo "fail_line=${FAIL_LINE}" >> "$GITHUB_OUTPUT"
          fi
        working-directory: scripts/zaobao/python

      - name: 第7步失败推送 Bark
        if: steps.collect.outputs.step7_fail == '1'
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          FAIL_LINE: ${{ steps.collect.outputs.fail_line }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          curl -sSf -X POST "https://api.day.app/${BARK_KEY}" \
            -H "Content-Type: application/json" \
            --data "$(jq -n \
              --arg t "韭研涨停原因采集失败" \
              --arg b "$FAIL_LINE" \
              --arg u "$RUN_URL" \
              '{title:$t, body:$b, url:$u, group:"quantstock", level:"timeSensitive"}')"
