name: 财联社快讯采集

on:
  workflow_dispatch:  # 由 cron-job.org 外部触发

concurrency:
  group: cls-flash-collector
  cancel-in-progress: false  # 不取消进行中的任务，等待上次完成

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/zaobao/python/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt
        working-directory: scripts/zaobao/python

      - name: 执行快讯采集
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          JIUYAN_SESSION: ${{ secrets.JIUYAN_SESSION }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: python cls_news_collector.py --mode flash
        working-directory: scripts/zaobao/python
