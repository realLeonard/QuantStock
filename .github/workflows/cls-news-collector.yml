name: 财联社深度采集（热门+A股）

on:
  workflow_dispatch:  # 由 cron-job.org 外部触发

concurrency:
  group: cls-news-collector
  cancel-in-progress: false   # 不取消进行中的任务，等待上次完成

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/zaobao/python/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt
        working-directory: scripts/zaobao/python

      - name: 执行热门+A股深度采集
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python cls_news_collector.py --mode depth
        working-directory: scripts/zaobao/python
