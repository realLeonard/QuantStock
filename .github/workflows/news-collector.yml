name: 每小时新闻采集

on:
  # schedule:
  #   - cron: '7 * * * *'  # 已停用，由 cls-news-collector.yml 替代（2026-03-23）
  workflow_dispatch:       # 保留手动触发，供调试旧脚本使用

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/zaobao/python/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt
        working-directory: scripts/zaobao/python

      - name: 执行新闻采集
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python news_collector.py
        working-directory: scripts/zaobao/python
