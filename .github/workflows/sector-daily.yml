name: 板块数据每日采集

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - init
          - test_kline
      skip_master:
        description: '跳过板块列表同步（init 模式下 DB 已有数据时使用）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      init_days:
        description: '初始化拉取天数（默认60）'
        required: false
        default: '60'
      force_run:
        description: '强制运行（跳过交易日检查，用于周末测试）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      date:
        description: '指定采集日期（YYYY-MM-DD），留空=今天。盘前补昨日数据时使用'
        required: false
        default: ''

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/shared
      - id: check
        run: |
          FORCE="${{ inputs.force_run }}"
          if [ "$FORCE" = "true" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo '强制运行模式'
            exit 0
          fi
          RESULT=$(python3 -c "
          import sys; sys.path.insert(0, 'scripts/shared')
          from trading_calendar import is_trading_day_today
          print('1' if is_trading_day_today() else '0')
          ")
          echo "run=$RESULT" >> "$GITHUB_OUTPUT"
          if [ "$RESULT" = "0" ]; then
            echo '非交易日，跳过采集'
          else
            echo '交易日，执行采集'
          fi

  collect:
    needs: gate
    if: needs.gate.outputs.run == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r scripts/sector-prediction/python/requirements.txt

      - name: 运行采集
        id: collect
        run: |
          set -o pipefail
          if [ "${{ inputs.mode }}" = "init" ]; then
            echo "=== 初始化模式 ==="
            python scripts/sector-prediction/python/init_master.py 2>&1 | tee /tmp/sector-output.log
          elif [ "${{ inputs.mode }}" = "test_kline" ]; then
            echo "=== K 线测试 ==="
            python scripts/sector-prediction/python/test_kline.py 2>&1 | tee /tmp/sector-output.log
          else
            echo "=== 每日增量模式 ==="
            DATE_ARG=""
            if [ -n "${{ inputs.date }}" ]; then
              DATE_ARG="--date ${{ inputs.date }}"
            fi
            python scripts/sector-prediction/python/main.py $DATE_ARG 2>&1 | tee /tmp/sector-output.log
          fi
        env:
          PYTHONUNBUFFERED: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SKIP_MASTER: ${{ inputs.skip_master }}
          INIT_DAYS: ${{ inputs.init_days }}
          FORCE_RUN: ${{ inputs.force_run }}

      - uses: actions/setup-node@v4
        if: success() && inputs.mode == 'daily'
        with:
          node-version: '22'

      - name: 安装 Claude CLI
        if: success() && inputs.mode == 'daily'
        run: npm install -g @anthropic-ai/claude-code

      - name: 运行评分（含回填+6维评分+市场分级+生命周期）
        if: success() && inputs.mode == 'daily'
        run: |
          set -o pipefail
          echo "=== 板块评分 ==="
          python scripts/sector-prediction/python/scoring.py 2>&1 | tee /tmp/scoring-output.log
        env:
          PYTHONUNBUFFERED: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'

      - name: 推送评分结果
        if: success() && inputs.mode == 'daily'
        run: |
          cd scripts/sector-prediction
          npm install --production
          npx tsx push-scores.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}

      - name: Bark 失败通知
        if: failure()
        run: |
          BARK_KEY="${{ secrets.BARK_KEY }}"
          if [ -z "$BARK_KEY" ]; then exit 0; fi
          TITLE="板块采集失败"
          # 提取最后几行关键日志
          if [ -f /tmp/sector-output.log ]; then
            BODY=$(grep -E '(error|失败|熔断|FAIL)' /tmp/sector-output.log | tail -3 | tr '\n' ' ')
          fi
          if [ -z "$BODY" ]; then
            BODY="采集脚本异常退出，请检查 Actions 日志"
          fi
          TITLE_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TITLE")
          BODY_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$BODY")
          curl -s "https://api.day.app/${BARK_KEY}/${TITLE_ENC}/${BODY_ENC}?group=QuantStock" || true

      - name: Bark 成功通知（含数据摘要）
        if: success() && inputs.mode != 'test_kline'
        run: |
          BARK_KEY="${{ secrets.BARK_KEY }}"
          if [ -z "$BARK_KEY" ]; then exit 0; fi
          TITLE="板块采集完成"
          BODY="无摘要"
          if [ -f /tmp/sector-output.log ]; then
            # 提取汇总行
            KLINE=$(grep 'K 线' /tmp/sector-output.log | grep '成功' | tail -1 | sed 's/.*K 线/K线/' || true)
            FUND=$(grep '资金流匹配率' /tmp/sector-output.log | tail -1 | sed 's/.*资金流/资金流/' || true)
            SECTORS=$(grep 'active 板块总数' /tmp/sector-output.log | tail -1 | grep -oP '\d+' || true)
            BODY="${SECTORS}板块 | ${KLINE} | ${FUND}"
          fi
          TITLE_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$TITLE")
          BODY_ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$BODY")
          curl -s "https://api.day.app/${BARK_KEY}/${TITLE_ENC}/${BODY_ENC}?group=QuantStock" || true
