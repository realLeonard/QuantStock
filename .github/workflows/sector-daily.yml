name: 板块数据每日采集

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: 'daily'
        type: choice
        options:
          - daily
          - init
      skip_master:
        description: '跳过板块列表同步（init 模式下 DB 已有数据时使用）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      init_days:
        description: '初始化拉取天数（默认60）'
        required: false
        default: '60'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 配置 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: 执行板块数据采集（阿里云）
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'ENDSSH'
          set -e
          cd /www/wwwroot/quantstock

          # 加载环境变量
          set -a && source .env.server && set +a

          echo "====== 拉取最新代码 ======"
          git checkout -- package-lock.json 2>/dev/null || true
          git pull origin main

          echo "====== 安装 Python 依赖 ======"
          pip3.11 install -q -r scripts/sector-prediction/python/requirements.txt

          echo "====== 运行采集 ======"
          export PYTHONUNBUFFERED=1
          export SKIP_MASTER="${{ inputs.skip_master }}"
          export INIT_DAYS="${{ inputs.init_days }}"

          cd scripts/sector-prediction/python
          if [ "${{ inputs.mode }}" = "init" ]; then
            echo "=== 初始化模式 ==="
            python3.11 init_master.py
          else
            echo "=== 每日增量模式 ==="
            python3.11 main.py
          fi

          echo "====== 完成 ======"
          ENDSSH
